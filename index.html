<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>응가 도장판 💩</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(180deg, #fff6d6 0%, #ffe0ec 100%);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px;
      user-select: none;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    h1 { font-size: 1.35rem; color: #8a5a2b; }
    .count { font-size: 1rem; color: #a0704a; font-weight: bold; }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 480px;
      flex: 1;
      min-height: 0;
    }
    .princess-card {
      order: -1;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      padding: 8px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      text-align: center;
    }
    .princess-stage {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border-radius: 14px;
      background: #2b194d;
    }
    #princessImg, #princessImgNext {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      border-radius: 14px;
    }
    #princessImgNext {
      opacity: 0;
      pointer-events: none;
    }
    #princessImgNext.show { animation: fadeIn 1.2s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sparkle-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 6rem;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
    }
    .sparkle-burst.show { animation: burst 1.2s ease-out; }
    @keyframes burst {
      0% { transform: translate(-50%, -50%) scale(0) rotate(0); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.6) rotate(90deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.2) rotate(180deg); opacity: 0; }
    }
    .princess-msg {
      font-size: 0.98rem;
      font-weight: bold;
      color: #9561c4;
      min-height: 1.4em;
      margin-top: 6px;
      flex-shrink: 0;
    }

    /* 하단 작게 10개 표시되는 도장판 */
    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px;
      background: #fff;
      padding: 6px 8px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      width: 100%;
      flex-shrink: 0;
    }
    .slot {
      aspect-ratio: 1;
      min-width: 0;
      border: 1.5px dashed #f3c27a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #e0b884;
      font-weight: bold;
    }
    .slot.stamped {
      border: 1.5px solid #ff8fab;
      background: #fff0f5;
      font-size: 1rem;
      animation: pop 0.4s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.2) rotate(-30deg); }
      70% { transform: scale(1.25) rotate(10deg); }
      100% { transform: scale(1) rotate(0); }
    }

    .stamp-btn {
      margin-top: 8px;
      width: 100%;
      max-width: 480px;
      font-size: 1.35rem;
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      background: #ff8fab;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 4px 0 #e06b8a;
      cursor: pointer;
      flex-shrink: 0;
    }
    .stamp-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e06b8a; }

    .reset-btn {
      margin-top: 6px;
      background: none;
      border: none;
      color: #b89a80;
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 보상 / 룰렛 공통 오버레이 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .overlay p {
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      margin: 16px 0 24px;
      text-align: center;
    }
    .overlay button {
      font-size: 1.4rem;
      padding: 14px 32px;
      border: none;
      border-radius: 40px;
      background: #ffd166;
      color: #8a5a2b;
      font-weight: bold;
      box-shadow: 0 5px 0 #d9a93f;
      cursor: pointer;
    }
    .overlay button:active { transform: translateY(3px); box-shadow: 0 2px 0 #d9a93f; }
    .overlay button:disabled { opacity: 0.5; }

    /* 완성 장면 (gif 느낌) */
    .finale { background: rgba(30, 10, 50, 0.85); }
    .finale-title {
      color: #fff;
      font-size: 2.4rem;
      font-weight: bold;
      margin-bottom: 16px;
      text-shadow: 0 0 12px #ff9ec7;
      animation: bounce 1s infinite;
    }
    .finale-frame {
      position: relative;
      width: min(92vw, 440px);
      height: min(74dvh, 580px);
      overflow: hidden;
      border-radius: 20px;
      border: 6px solid #fff;
      box-shadow: 0 0 40px #ff9ec7, 0 0 80px #b07cd8;
    }
    .finale.show .finale-frame { animation: zoomIn 0.8s ease-out; }
    .finale-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }
    .finale.show .finale-frame img { animation: kenburns 5s ease-in-out forwards, sway 1.6s ease-in-out infinite; }
    @keyframes zoomIn {
      from { transform: scale(0.3); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    /* 천천히 확대하며 공주 쪽으로 이동 */
    @keyframes kenburns {
      0% { scale: 1.05; translate: 0 0; }
      100% { scale: 1.25; translate: 8% 4%; }
    }
    /* 살랑살랑 흔들림 */
    @keyframes sway {
      0%, 100% { rotate: -0.6deg; }
      50% { rotate: 0.6deg; }
    }
    .shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.45) 50%, transparent 65%);
      transform: translateX(-100%);
      animation: shine 2.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shine {
      to { transform: translateX(100%); }
    }
    .sparkle {
      position: absolute;
      pointer-events: none;
      animation: sparkle 1.4s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* 선물 */
    .gift {
      font-size: 9rem;
      cursor: pointer;
      animation: bounce 1s infinite;
      background: none;
      border: none;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-25px) rotate(5deg); }
    }

    /* 룰렛 */
    .wheel-wrap {
      position: relative;
      width: min(85vw, 380px);
      height: min(85vw, 380px);
    }
    .pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 36px solid #ff4d6d;
      z-index: 2;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    }
    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #fff;
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .result {
      min-height: 2.5em;
    }
    .result.win {
      animation: pop 0.5s ease-out;
      color: #ffd166 !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>💩 응가 도장판 💩</h1>
    <div class="count" id="count">0 / 10</div>
  </div>

  <div class="main">
    <div class="board" id="board"></div>

    <!-- 공주 꾸미기 -->
    <div class="princess-card">
      <div class="princess-stage" id="princessStage">
        <img id="princessImg" src="images/1-0.jpg" alt="공주와 유니콘" />
        <img id="princessImgNext" alt="" />
        <div class="sparkle-burst" id="sparkleBurst">✨</div>
      </div>
      <div class="princess-msg" id="princessMsg"></div>
    </div>
  </div>

  <button class="stamp-btn" id="stampBtn">응가 했어요! 💩</button>
  <button class="reset-btn" id="resetBtn">처음부터 다시하기</button>

  <!-- 0단계: 완성 그림 크게 보여주기 -->
  <div class="overlay finale" id="finale">
    <div class="finale-title">🎉 공주님 완성! 🎉</div>
    <div class="finale-frame">
      <img id="finaleImg" src="images/1-10.jpg" alt="완성된 공주와 유니콘" />
      <div class="shine"></div>
      <div id="finaleSparkles"></div>
    </div>
  </div>

  <!-- 1단계: 선물 -->
  <div class="overlay" id="reward">
    <button class="gift" id="giftBtn">🎁</button>
    <p>도장 10개 완성! 🎉<br />선물을 눌러보세요!</p>
  </div>

  <!-- 2단계: 룰렛 -->
  <div class="overlay" id="roulette">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheel" width="600" height="600"></canvas>
    </div>
    <p class="result" id="result">룰렛을 돌려보세요!</p>
    <button id="spinBtn">돌려라! 🎡</button>
    <button id="newBoardBtn" style="display:none">새 도장판 시작하기</button>
  </div>

  <script>
    const GOAL = 10;
    const SETS = [1, 3];
    const STORAGE_KEY = "poopStampCount";
    const SET_KEY = "poopSetIndex";

    // 룰렛 보상 목록
    const PRIZES = [
      { icon: "💰", lines: ["용돈", "5천원"],       text: "용돈 5천원",        color: "#ffadad" },
      { icon: "💵", lines: ["용돈", "만원"],        text: "용돈 만원",         color: "#ffd6a5" },
      { icon: "🧸", lines: ["원하는", "장난감 사기"], text: "원하는 장난감 사기", color: "#caffbf" },
      { icon: "📺", lines: ["원하는", "티비 3개"],   text: "원하는 티비 3개 보기", color: "#9bf6ff" },
      { icon: "🍬", lines: ["원하는", "젤리 2개"],   text: "원하는 젤리 2개 먹기", color: "#bdb2ff" },
    ];

    const boardEl = document.getElementById("board");
    const countEl = document.getElementById("count");
    const rewardEl = document.getElementById("reward");
    const rouletteEl = document.getElementById("roulette");
    const wheelEl = document.getElementById("wheel");
    const resultEl = document.getElementById("result");
    const spinBtn = document.getElementById("spinBtn");
    const newBoardBtn = document.getElementById("newBoardBtn");
    const finaleImg = document.getElementById("finaleImg");

    // 저장된 도장 개수 및 현재 세트 순서 불러오기
    let count = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    let setIndex = Number(localStorage.getItem(SET_KEY)) || 0;
    if (setIndex < 0 || setIndex >= SETS.length) setIndex = 0;

    function save() {
      localStorage.setItem(STORAGE_KEY, count);
      localStorage.setItem(SET_KEY, setIndex);
    }

    function render(animateIndex = -1) {
      boardEl.innerHTML = "";
      for (let i = 0; i < GOAL; i++) {
        const slot = document.createElement("div");
        slot.className = "slot";
        if (i < count) {
          slot.classList.add("stamped");
          slot.textContent = "💩";
          if (i !== animateIndex) slot.style.animation = "none";
        } else {
          slot.textContent = i + 1;
        }
        boardEl.appendChild(slot);
      }
      countEl.textContent = `${count} / ${GOAL}`;
      renderPrincess(animateIndex + 1);
    }

    // ===== 공주 꾸미기 =====
    const PRINCESS_MSGS = [
      "공주님이 예쁜 옷을 기다리고 있어요!",
      "👗 예쁜 드레스 치마를 입었어요!",
      "👚 예쁜 상의를 입었어요!",
      "🐴 하얀 말이 찾아왔어요!",
      "🦄 무지개 뿔! 유니콘이 됐어요!",
      "👠 반짝반짝 유리구두를 신었어요!",
      "🧤 하얀 장갑을 꼈어요!",
      "💄 예쁘게 화장을 했어요!",
      "🪽 유니콘에게 날개가 생겼어요!",
      "💎 귀걸이, 팔찌, 목걸이를 했어요!",
      "👑 왕관과 마법봉! 최고로 예쁜 공주님 완성!",
    ];

    // 단계별 그림 미리 불러오기
    const stageSrc = (n) => `images/${SETS[setIndex]}-${n}.jpg`;
    function preloadSet() {
      for (let i = 0; i <= GOAL; i++) new Image().src = stageSrc(i);
    }
    preloadSet();

    const princessImg = document.getElementById("princessImg");
    const princessImgNext = document.getElementById("princessImgNext");
    const sparkleBurst = document.getElementById("sparkleBurst");

    function renderPrincess(newStep = 0) {
      const stage = Math.min(count, GOAL);
      document.getElementById("princessMsg").textContent = PRINCESS_MSGS[stage];
      finaleImg.src = stageSrc(GOAL);

      if (newStep > 0 && newStep === stage) {
        // 새 그림이 서서히 나타나며 반짝!
        princessImgNext.src = stageSrc(stage);
        princessImgNext.classList.remove("show");
        sparkleBurst.classList.remove("show");
        void princessImgNext.offsetWidth; // 애니메이션 재시작
        princessImgNext.classList.add("show");
        sparkleBurst.classList.add("show");
        setTimeout(() => {
          princessImg.src = stageSrc(stage);
          princessImgNext.classList.remove("show");
        }, 1250);
      } else {
        princessImg.src = stageSrc(stage);
      }
    }

    function showReward() {
      rewardEl.classList.add("show");
    }

    // 완성 그림을 5초 동안 크게 보여준 뒤 선물 창 띄우기
    const FINALE_MS = 5000;
    function showFinale() {
      finaleImg.src = stageSrc(GOAL);
      const finaleEl = document.getElementById("finale");
      const box = document.getElementById("finaleSparkles");
      box.innerHTML = "";
      const icons = ["✨", "💖", "⭐", "🌟", "💜", "🦄"];
      for (let i = 0; i < 24; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.textContent = icons[i % icons.length];
        s.style.left = Math.random() * 95 + "%";
        s.style.top = Math.random() * 90 + "%";
        s.style.fontSize = 1.2 + Math.random() * 1.8 + "rem";
        s.style.animationDelay = Math.random() * 1.4 + "s";
        box.appendChild(s);
      }
      finaleEl.classList.add("show");
      setTimeout(() => {
        finaleEl.classList.remove("show");
        showReward();
      }, FINALE_MS);
    }

    // ===== 룰렛 =====
    const SEG = 360 / PRIZES.length;
    let rotation = 0;

    function drawWheel() {
      const ctx = wheelEl.getContext("2d");
      const size = wheelEl.width;
      const c = size / 2;
      const r = c;
      ctx.clearRect(0, 0, size, size);

      PRIZES.forEach((p, i) => {
        // 12시 방향부터 시계방향으로 칸 배치
        const start = ((-90 + i * SEG) * Math.PI) / 180;
        const end = ((-90 + (i + 1) * SEG) * Math.PI) / 180;

        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.arc(c, c, r, start, end);
        ctx.closePath();
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.stroke();

        // 글자
        ctx.save();
        ctx.translate(c, c);
        ctx.rotate((start + end) / 2);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#5a3d2b";
        ctx.rotate(Math.PI / 2); // 글자가 바깥을 향해 세워지도록
        ctx.font = "64px sans-serif";
        ctx.fillText(p.icon, 0, -r * 0.75);
        ctx.font = "bold 34px 'Malgun Gothic', sans-serif";
        ctx.fillText(p.lines[0], 0, -r * 0.54);
        ctx.fillText(p.lines[1], 0, -r * 0.42);
        ctx.restore();
      });

      // 가운데 원
      ctx.beginPath();
      ctx.arc(c, c, 40, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.font = "44px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("💩", c, c + 3);
    }

    function openRoulette() {
      rewardEl.classList.remove("show");
      rouletteEl.classList.add("show");
      resultEl.textContent = "룰렛을 돌려보세요!";
      resultEl.classList.remove("win");
      spinBtn.style.display = "";
      spinBtn.disabled = false;
      newBoardBtn.style.display = "none";
    }

    function spin() {
      spinBtn.disabled = true;
      resultEl.textContent = "두근두근... 🥁";
      resultEl.classList.remove("win");

      const index = Math.floor(Math.random() * PRIZES.length);
      // 해당 칸의 중앙(약간의 랜덤 오차)이 12시 방향 화살표에 오도록 회전
      const jitter = (Math.random() - 0.5) * SEG * 0.7;
      const target = 360 - (index * SEG + SEG / 2) + jitter;
      const current = ((rotation % 360) + 360) % 360;
      let delta = target - current;
      if (delta < 0) delta += 360;
      rotation += 360 * 5 + delta;
      wheelEl.style.transform = `rotate(${rotation}deg)`;

      setTimeout(() => {
        const prize = PRIZES[index];
        resultEl.innerHTML = `${prize.icon} ${prize.text}! ${prize.icon}`;
        resultEl.classList.add("win");
        spinBtn.style.display = "none";
        newBoardBtn.style.display = "";
      }, 4100);
    }

    // ===== 이벤트 =====
    document.getElementById("stampBtn").addEventListener("click", () => {
      if (count >= GOAL) {
        showReward();
        return;
      }
      count++;
      save();
      render(count - 1);
      if (count === GOAL) setTimeout(showFinale, 1400);
    });

    document.getElementById("giftBtn").addEventListener("click", openRoulette);
    spinBtn.addEventListener("click", spin);

    newBoardBtn.addEventListener("click", () => {
      count = 0;
      setIndex = (setIndex + 1) % SETS.length;
      save();
      preloadSet();
      render();
      rouletteEl.classList.remove("show");
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (confirm("도장을 모두 지울까요?")) {
        count = 0;
        save();
        render();
      }
    });

    drawWheel();
    render();
    if (count >= GOAL) showReward();
  </script>
</body>
</html>
